name: Build BA仔 for Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      BAZAI_UPDATE_ENDPOINT: https://github.com/robeswang-ship-it/zhao_house/releases/latest/download/latest.json
      BAZAI_RELEASE_REPOSITORY: robeswang-ship-it/zhao_house
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri:build:release
      - name: Verify both Windows webviews actually start
        shell: pwsh
        run: |
          $env:BAZAI_SMOKE_TEST = "1"
          $process = Start-Process -FilePath "src-tauri/target/release/ba-zai.exe" -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw "BA仔 Windows 启动自检超时：桌宠页或控制面板页没有成功挂载。"
          }
          if ($process.ExitCode -ne 0) {
            throw "BA仔 Windows 启动自检失败，退出码：$($process.ExitCode)"
          }
      - run: npm run make:update-manifest
      - name: Publish signed updater files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v${version}" --repo "${BAZAI_RELEASE_REPOSITORY}" --title "BA仔 v${version}" --generate-notes "src-tauri/target/release/bundle/nsis/"*.exe "src-tauri/target/release/bundle/nsis/"*.exe.sig "src-tauri/target/release/bundle/nsis/latest.json#latest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: BA仔-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
