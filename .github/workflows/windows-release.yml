name: Build BA仔 for Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      BAZAI_UPDATE_ENDPOINT: https://github.com/robeswang-ship-it/zhao_house/releases/latest/download/latest.json
      BAZAI_RELEASE_REPOSITORY: robeswang-ship-it/zhao_house
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri:build:release
      - run: npm run make:update-manifest
      - name: Publish signed updater files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v${version}" --repo "${BAZAI_RELEASE_REPOSITORY}" --title "BA仔 v${version}" --generate-notes "src-tauri/target/release/bundle/nsis/"*.exe "src-tauri/target/release/bundle/nsis/"*.exe.sig "src-tauri/target/release/bundle/nsis/latest.json#latest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: BA仔-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
